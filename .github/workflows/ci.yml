name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FitCore.sln
      - name: Build (warnings as errors)
        run: dotnet build FitCore.sln --no-restore -c Release
      - name: Test (las pruebas de integración levantan PostgreSQL con Testcontainers)
        run: dotnet test FitCore.sln --no-build -c Release
      - name: Vulnerable packages
        run: |
          dotnet list FitCore.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build --configuration production
      - name: Vulnerable dependencies (high or critical)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/web/package-lock.json
            tests/e2e/package-lock.json
      - name: Secretos efímeros del entorno de pruebas
        run: |
          cat > infra/compose/.env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          APP_DB_PASSWORD=$(openssl rand -hex 16)
          JWT_SIGNING_KEY=$(openssl rand -hex 32)
          PLATFORM_ADMIN_EMAIL=admin@fitcore.ci
          PLATFORM_ADMIN_PASSWORD=Ci-$(openssl rand -hex 8)-Aa1
          EOF
      - name: API + PostgreSQL
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml --env-file infra/compose/.env up -d --build postgres api
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health/ready
      - run: npm ci
        working-directory: src/web
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Pruebas end-to-end (navegador real contra API + base de datos reales)
        run: npx playwright test
        working-directory: tests/e2e
      - name: Registros de la API si falló
        if: failure()
        run: docker compose -f infra/compose/docker-compose.dev.yml --env-file infra/compose/.env logs api --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: tests/e2e/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f infra/docker/Api.Dockerfile -t fitcore-api:ci .
      - name: Build Worker image
        run: docker build -f infra/docker/Worker.Dockerfile -t fitcore-worker:ci .
      - name: Build Web image
        run: docker build -f infra/docker/Web.Dockerfile -t fitcore-web:ci .
