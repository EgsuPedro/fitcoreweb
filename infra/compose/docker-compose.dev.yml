# Entorno de desarrollo local. Uso (desde la raíz del repo):
#   cp infra/compose/.env.example infra/compose/.env   # y cambie TODOS los valores
#   docker compose -f infra/compose/docker-compose.dev.yml --env-file infra/compose/.env up --build
#
# Dos usuarios de PostgreSQL:
#   - POSTGRES_USER (propietario): solo lo usa la API para aplicar migraciones al arrancar (solo desarrollo).
#   - fitcore_app (sin privilegios de superusuario): el que usan la API y el Worker en ejecución. Está sujeto a
#     Row-Level Security, por eso el aislamiento entre gimnasios también se cumple en la base de datos.
name: fitcore360

x-db-app: &db-app
  Host=postgres;Port=5432;Database=${POSTGRES_DB:-fitcore};Username=fitcore_app;Password=${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD en infra/compose/.env}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitcore}
      POSTGRES_USER: ${POSTGRES_USER:-fitcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en infra/compose/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitcore} -d ${POSTGRES_DB:-fitcore}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Buzón de desarrollo: recibe los correos reales que envía el sistema por SMTP y los muestra en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: *db-app
      ConnectionStrings__Migrations: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fitcore};Username=${POSTGRES_USER:-fitcore};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrate: "true"
      Database__AppRolePassword: ${APP_DB_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY (mínimo 32 caracteres) en infra/compose/.env}
      Platform__AdminEmail: ${PLATFORM_ADMIN_EMAIL:-}
      Platform__AdminPassword: ${PLATFORM_ADMIN_PASSWORD:-}
      # Proveedor de pagos: sin secreto no hay proveedor y los webhooks se rechazan (todo pago se registra a mano).
      Subscriptions__Payments__ProviderCode: ${PAYMENT_PROVIDER_CODE:-webhook}
      Subscriptions__Payments__WebhookSecret: ${PAYMENT_WEBHOOK_SECRET:-}
      # Límite de intentos de acceso por minuto y por IP. Las pruebas end-to-end inician muchas sesiones desde una sola IP: en CI se sube.
      RateLimiting__LoginPermitPerMinute: ${LOGIN_RATE_LIMIT:-20}
      # Registro, confirmación, recuperación de contraseña, invitaciones y contacto (por IP y por minuto). Las pruebas end-to-end los usan mucho desde una sola IP.
      RateLimiting__RegisterPermitPerMinute: ${REGISTER_RATE_LIMIT:-10}
      RateLimiting__RecoveryPermitPerMinute: ${REGISTER_RATE_LIMIT:-10}
      # Redes privadas de Docker: solo ahí se confía en X-Forwarded-For (lo envía el nginx del servicio web).
      Network__TrustedProxies__0: 10.0.0.0/8
      Network__TrustedProxies__1: 172.16.0.0/12
      Network__TrustedProxies__2: 192.168.0.0/16
      # Correo: en desarrollo se entrega a Mailpit (buzón local, interfaz en http://localhost:8025). Nada sale a internet.
      Email__Smtp__Host: ${SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${SMTP_PORT:-1025}
      Email__Smtp__Security: ${SMTP_SECURITY:-None}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__From: ${SMTP_FROM:-no-reply@fit360.local}
      Email__Smtp__FromName: FIT360
      PublicSite__BaseUrl: ${PUBLIC_SITE_URL:-http://localhost:8081}
      # Aviso al equipo comercial cuando llega un contacto o una demostración (vacío = solo queda en la pantalla de plataforma).
      Contact__NotifyEmail: ${CONTACT_NOTIFY_EMAIL:-}
    volumes:
      # Fotos de progreso: privadas, solo accesibles desde la API. Incluir este volumen en las copias de seguridad.
      - fitcore_files:/var/lib/fitcore/files
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend servido por nginx, que también reenvía /api a la API (mismo origen: la cookie de refresh no necesita CORS).
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Web.Dockerfile
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - api

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: *db-app
      Email__Smtp__Host: ${SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${SMTP_PORT:-1025}
      Email__Smtp__Security: ${SMTP_SECURITY:-None}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__From: ${SMTP_FROM:-no-reply@fit360.local}
      Email__Smtp__FromName: FIT360
      PublicSite__BaseUrl: ${PUBLIC_SITE_URL:-http://localhost:8081}
    depends_on:
      postgres:
        condition: service_healthy
      # La API crea el rol y aplica las migraciones al arrancar; hasta entonces el Worker reintenta cada 5 s.
      api:
        condition: service_started

volumes:
  pgdata:
  fitcore_files:
