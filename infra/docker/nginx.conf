server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mismo origen para web y API: la cookie de refresh (HttpOnly, SameSite=Strict, ruta /api/v1/auth) funciona sin CORS.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Compresión de texto (JS, CSS, HTML, JSON). Si hay un proxy delante (Caddy en producción) este ya viene comprimido y nginx no lo repite.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Los archivos con hash en el nombre no cambian: caché larga. index.html y traducciones, siempre frescos.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location / {
    # Las páginas públicas están prerenderizadas (carpeta/index.html); todo lo demás es la aplicación (index.csr.html), no la portada.
    try_files $uri $uri/index.html /index.csr.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security-headers.inc;
  }
}
